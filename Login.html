<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>School Payment Login</title>
  <!-- Link to external CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- HTML -->
<div class="university-header">
  <img src="university-logo.png" alt="University Logo" class="university-logo">
  <h1 class="university-name">Your University Name</h1>
</div>

  <div class="login-box">
    <h2>Student Login</h2>
    <form onsubmit="return login()">
      <input type="text" id="studentId" placeholder="Student ID" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <p class="footer">Forgot password? Contact admin.</p>
  </div>

  <script>
    function login() {
      const id = document.getElementById('studentId').value;
      const pw = document.getElementById('password').value;
      if(id && pw) {
        alert("Login successful! Redirecting...");
        window.location.href = "dashboard.html"; // next page
      } else {
        alert("Please enter your ID and password.");
      }
      return false;
    }
  </script>
</body>
</html>
