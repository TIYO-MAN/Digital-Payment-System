<!DOCTYPE html>
<html>
<head>
  <title>School Payment Login</title>
  <style>
    body { font-family: Arial; background: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .login-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 300px; }
    .login-box h2 { text-align: center; margin-bottom: 20px; }
    input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 10px; background: #007BFF; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Student Login</h2>
    <form onsubmit="return login()">
      <input type="text" id="studentId" placeholder="Student ID" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
  </div>

  <script>
    function login() {
      const id = document.getElementById('studentId').value;
      const pw = document.getElementById('password').value;
      // For demo: just check if not empty
      if(id && pw) {
        alert("Login successful! Redirecting...");
        window.location.href = "dashboard.html"; // next page
      } else {
        alert("Please enter your ID and password.");
      }
      return false;
    }
  </script>
</body>
</html>
